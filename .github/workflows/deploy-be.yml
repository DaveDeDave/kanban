name: Publish back-end to Cloudflare Workers
on:
  push:
    branches: [prod]
    paths:
      - "packages/backend/workers/main/**"
      - "packages/backend/libs/base/**"
      - ".github/workflows/deploy-be.yml"
      - "yarn.lock"
  workflow_dispatch:

jobs:
  publish-be:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Publish to Cloudflare Workers
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: yarn
      - name: Launch test database
        run: sudo docker compose -f docker-compose.dev.yml up -d --wait
      - name: Build
        run: yarn workspace @kanban/main-worker build
      - name: Apply Drizzle migrations to test database
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: yarn workspace @kanban/main-worker db:migrate
      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: yarn workspace @kanban/main-worker test:integration
      - name: Apply Drizzle migrations to production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: yarn workspace @kanban/main-worker db:migrate
      - name: Deploy
        run: CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }} yarn workspace @kanban/main-worker deploy
